name: ClipConvert public uptime
on:
  push:
    paths:
      - '.github/workflows/uptime.yml'
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clipconvert-uptime
  cancel-in-progress: true
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify HTTPS homepage, storage health, and search endpoints
        env:
          SITE: https://clipconvert-web-production.up.railway.app
        run: |
          python - <<'PY'
          import json,os,urllib.request
          root=os.environ["SITE"].rstrip("/")
          for route in ("/","/api/health","/assets/main.js","/assets/premium.css",
                        "/robots.txt","/sitemap.xml"):
              request=urllib.request.Request(root+route,headers={"User-Agent":"ClipConvertUptime/1.0"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  body=response.read(150000)
                  assert response.status==200,(route,response.status)
                  if route=="/":
                      assert b"ClipConvert" in body and b"historySection" in body
                  if route=="/api/health":
                      data=json.loads(body)
                      assert data["status"]=="ok" and data["ffmpeg"],data
                      assert data.get("storage_ready"),data
                      assert int(data.get("storage_free_mb",0))>=200,("Low disk space",data)
                      assert "durable_jobs" in data.get("features",[]),data
                  if route=="/robots.txt":
                      assert b"Sitemap:" in body
                  if route=="/sitemap.xml":
                      assert b"<urlset" in body
                  print("OK",route,flush=True)
          print("CLIPCONVERT HEALTHY",flush=True)
          PY
