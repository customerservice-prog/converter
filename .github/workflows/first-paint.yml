name: ClipConvert first-paint visual checks
on:
  push:
    paths:
      - ".github/workflows/first-paint.yml"
      - "tests/test_first_paint.mjs"
      - "static/index.html"
      - "static/site.css"
      - "app.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clipconvert-first-paint
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium for actual browser-render verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check first-paint layout on desktop and mobile
        run: node tests/test_first_paint.mjs
