name: Live production checks
on:
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'app.py'
      - 'requirements.txt'
      - 'static/**'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live site and on-server media conversion
        env:
          SITE: https://clipconvert-web-production.up.railway.app
        run: |
          python - <<'PY'
          import io,json,os,struct,time,urllib.request,urllib.error,wave
          base=os.environ["SITE"].rstrip("/")
          def request(path,payload=None,content_type=None):
              headers={"User-Agent":"ClipConvertIntegrationTest/1.0"}
              if content_type: headers["Content-Type"]=content_type
              req=urllib.request.Request(base+path,data=payload,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      return resp.status,resp.read(500000),dict(resp.headers)
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.read(500000),dict(exc.headers)
          def multipart(fields,filename,content):
              bound="ClipConvertTestBound3f09"
              segments=[]
              for k,v in fields.items():
                  segments.extend([("--"+bound+"\r\nContent-Disposition: form-data; name=\""+k+"\"\r\n\r\n"+str(v)+"\r\n").encode()])
              segments.extend([("--"+bound+"\r\nContent-Disposition: form-data; name=\"file\"; filename=\""+filename+"\"\r\nContent-Type: audio/wav\r\n\r\n").encode(),content,b"\r\n",("--"+bound+"--\r\n").encode()])
              return b"".join(segments),"multipart/form-data; boundary="+bound
          for attempt in range(70):
              try:
                  code,body,_=request("/api/health")
                  data=json.loads(body)
                  assert code==200 and data["status"]=="ok" and data["ffmpeg"],data
                  if "upload" not in data.get("features",[]):
                      raise RuntimeError("New upload release is not live yet")
                  print("OK: deployed health and FFmpeg",data,flush=True)
                  break
              except Exception as exc:
                  if attempt==69:raise
                  if attempt%10==0:print("Waiting for updated release:",repr(exc)[:150],flush=True)
                  time.sleep(5)
          for path,needle in [("/","Upload file"),("/faq","ClipConvert"),("/assets/main.js","submitConversion"),("/assets/style.css","converter-card")]:
              code,body,_=request(path)
              assert code==200 and needle.lower() in body.decode().lower(),(path,code)
              print("OK:",path,flush=True)
          code,body,_=request("/api/jobs",json.dumps({"url":"https://youtu.be/NY6acnscmwo","format":"mp3","quality":128}).encode(),"application/json")
          assert code==400,body
          print("OK: rights confirmation required",flush=True)
          audio=io.BytesIO()
          with wave.open(audio,"wb") as wf:
              wf.setnchannels(1);wf.setsampwidth(2);wf.setframerate(16000)
              wf.writeframes(b"".join(struct.pack("<h",int(8000*(i%70)/70)) for i in range(16000)))
          payload,content_type=multipart({"format":"mp3","quality":"128","rights_confirmed":"true"},"test.wav",audio.getvalue())
          code,body,_=request("/api/upload",payload,content_type)
          assert code==202,(code,body[:500])
          jid=json.loads(body)["id"]
          for i in range(90):
              code,body,_=request("/api/jobs/"+jid)
              assert code==200,code
              job=json.loads(body)
              if job["state"] in ("ready","error"):break
              time.sleep(1)
          assert job["state"]=="ready",job
          code,body,headers=request(job["download_url"])
          assert code==200 and len(body)>4000,(code,len(body))
          assert "audio/mpeg" in headers["Content-Type"],headers["Content-Type"]
          print("SUCCESS: upload to MP3 download works on Railway",flush=True)
          # Release gate: verify the exact requested YouTube link completes as
          # both video and audio, and that both formats can actually be downloaded.
          for fmt, quality, mime in (("mp4",360,"video/mp4"),("mp3",192,"audio/mpeg")):
              payload=json.dumps({"url":"https://youtu.be/NY6acnscmwo",
                                  "format":fmt,"quality":quality,
                                  "rights_confirmed":True}).encode()
              code,body,_=request("/api/jobs",payload,"application/json")
              assert code==202,("YouTube job not started",fmt,code,body[:200])
              jid=json.loads(body)["id"]
              print("START YOUTUBE",fmt,jid,flush=True)
              for i in range(150):
                  code,body,_=request("/api/jobs/"+jid)
                  assert code==200,("job status",fmt,code)
                  state=json.loads(body)
                  if state["state"] in ("ready","error"): break
                  time.sleep(2)
              assert state["state"]=="ready",("YouTube extraction or conversion failed",fmt,state)
              code,body,headers=request(state["download_url"])
              assert code==200 and len(body)>10000,("Download unavailable",fmt,code,len(body))
              assert mime in headers["Content-Type"],("Wrong media type",fmt,headers["Content-Type"])
              if fmt=="mp4":
                  assert b"ftyp" in body[:48],("Invalid MP4 signature",body[:48])
              print("YOUTUBE_URL_RESULT: WORKING",fmt,"download bytes checked:",len(body),flush=True)
          print("ALL PRODUCTION CONVERSION CHECKS PASSED",flush=True)
          PY
