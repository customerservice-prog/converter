name: Live production checks
on:
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'app.py'
      - 'requirements.txt'
      - 'static/**'
  workflow_dispatch:
concurrency:
  group: clipconvert-production-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live site and on-server media conversion
        env:
          SITE: https://clipconvert-web-production.up.railway.app
        run: |
          python - <<'PY'
          import io,json,os,struct,time,urllib.request,urllib.error,wave
          base=os.environ["SITE"].rstrip("/")
          def request(path,payload=None,content_type=None):
              headers={"User-Agent":"ClipConvertIntegrationTest/1.0"}
              if content_type: headers["Content-Type"]=content_type
              req=urllib.request.Request(base+path,data=payload,headers=headers)
              for attempt in range(35):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as resp:
                          return resp.status,resp.read(500000),dict(resp.headers)
                  except urllib.error.HTTPError as exc:
                      status=exc.code
                      body=exc.read(500000)
                      # Railway's single mounted-volume service can briefly
                      # return 502 while the new instance takes over.
                      # Retry idempotent GETs; retry POSTs only when capacity
                      # explicitly rejected them with 503.
                      temporary=(payload is None and status in (502,503,504)) or (
                          payload is not None and status==503)
                      if temporary and attempt<34:
                          time.sleep(3)
                          continue
                      return status,body,dict(exc.headers)
                  except urllib.error.URLError:
                      if payload is None and attempt<34:
                          time.sleep(3)
                          continue
                      raise
          def complete_download(path):
              req=urllib.request.Request(base+path,headers={"User-Agent":"ClipConvertIntegrationTest/1.0"})
              with urllib.request.urlopen(req,timeout=180) as resp:
                  first=resp.read(4096)
                  total=len(first)
                  while True:
                      chunk=resp.read(1024*1024)
                      if not chunk:break
                      total+=len(chunk)
                  return resp.status,first,dict(resp.headers),total
          def multipart(fields,filename,content):
              bound="ClipConvertTestBound3f09"
              segments=[]
              for k,v in fields.items():
                  segments.extend([("--"+bound+"\r\nContent-Disposition: form-data; name=\""+k+"\"\r\n\r\n"+str(v)+"\r\n").encode()])
              segments.extend([("--"+bound+"\r\nContent-Disposition: form-data; name=\"file\"; filename=\""+filename+"\"\r\nContent-Type: audio/wav\r\n\r\n").encode(),content,b"\r\n",("--"+bound+"--\r\n").encode()])
              return b"".join(segments),"multipart/form-data; boundary="+bound
          for attempt in range(70):
              try:
                  code,body,_=request("/api/health")
                  data=json.loads(body)
                  assert code==200 and data["status"]=="ok" and data["ffmpeg"],data
                  if "aac_mp4_audio" not in data.get("features",[]):
                      raise RuntimeError("New upload release is not live yet")
                  print("OK: deployed health and FFmpeg",data,flush=True)
                  break
              except Exception as exc:
                  if attempt==69:raise
                  if attempt%10==0:print("Waiting for updated release:",repr(exc)[:150],flush=True)
                  time.sleep(5)
          for path,needle in [("/","Upload file"),("/faq","ClipConvert"),("/assets/main.js","submitConversion"),("/assets/style.css","converter-card")]:
              code,body,_=request(path)
              assert code==200 and needle.lower() in body.decode().lower(),(path,code)
              print("OK:",path,flush=True)
          code,body,_=request("/api/jobs",json.dumps({"url":"https://youtu.be/NY6acnscmwo","format":"mp3","quality":128}).encode(),"application/json")
          assert code==400,body
          print("OK: rights confirmation required",flush=True)
          audio=io.BytesIO()
          with wave.open(audio,"wb") as wf:
              wf.setnchannels(1);wf.setsampwidth(2);wf.setframerate(16000)
              wf.writeframes(b"".join(struct.pack("<h",int(8000*(i%70)/70)) for i in range(16000)))
          payload,content_type=multipart({"format":"mp3","quality":"128","rights_confirmed":"true"},"test.wav",audio.getvalue())
          code,body,_=request("/api/upload",payload,content_type)
          assert code==202,(code,body[:500])
          jid=json.loads(body)["id"]
          for i in range(90):
              code,body,_=request("/api/jobs/"+jid)
              assert code==200,code
              job=json.loads(body)
              if job["state"] in ("ready","error"):break
              time.sleep(1)
          assert job["state"]=="ready",job
          assert job.get("folder_url"),job
          zcode,zbody,zheaders=request(job["folder_url"])
          assert zcode==200 and zbody.startswith(b"PK"),("Organized folder ZIP invalid",zcode,zbody[:50])
          assert "application/zip" in zheaders["Content-Type"],zheaders["Content-Type"]
          assert json.loads(request("/api/jobs/"+jid)[1])["state"]=="downloaded"
          # Completed ZIP transfers intentionally delete the underlying file.
          print("SUCCESS: upload to MP3 + organized folder ZIP works on Railway",flush=True)
          # Release gate: verify the exact requested YouTube link completes as
          # both video and audio, and that both formats can actually be downloaded.
          for fmt, quality, mime in (("mp4",0,"video/mp4"),("mp3",0,"audio/mpeg")):
              payload=json.dumps({"url":"https://youtu.be/NY6acnscmwo",
                                  "format":fmt,"quality":quality,
                                  "rights_confirmed":True}).encode()
              code,body,_=request("/api/jobs",payload,"application/json")
              assert code==202,("YouTube job not started",fmt,code,body[:200])
              jid=json.loads(body)["id"]
              print("START YOUTUBE",fmt,jid,flush=True)
              for i in range(150):
                  code,body,_=request("/api/jobs/"+jid)
                  assert code==200,("job status",fmt,code)
                  state=json.loads(body)
                  if state["state"] in ("ready","error"): break
                  time.sleep(2)
              assert state["state"]=="ready",("YouTube extraction or conversion failed",fmt,state)
              assert state["quality"]==0,("Expected automatic quality",fmt,state)
              assert state.get("actual_quality"),("No actual output quality reported",fmt,state)
              if fmt=="mp4":
                  assert state.get("audio_codec")=="aac",("MP4 does not have AAC audio",state)
                  assert int(state.get("audio_channels") or 0)>=1,("No decodable audio channels",state)
                  print("MP4_AUDIO_RESULT: AAC VERIFIED",state["audio_channels"],"channels",flush=True)
              print("BEST QUALITY SELECTED:",fmt,state["actual_quality"],flush=True)
              if fmt=="mp4":
                  code,body,headers,total=complete_download(state["download_url"])
                  assert code==200 and total>10000,("Download unavailable",fmt,code,total)
                  assert mime in headers["Content-Type"],("Wrong media type",fmt,headers["Content-Type"])
                  assert b"ftyp" in body[:48],("Invalid MP4 signature",body[:48])
              else:
                  zstatus,zdata,zheaders=request(state["folder_url"])
                  assert zstatus==200 and zdata[:2]==b"PK",("Broken folder download",fmt,zstatus,zdata[:80])
                  total=len(zdata)
              assert json.loads(request("/api/jobs/"+jid)[1])["state"]=="downloaded"
              print("YOUTUBE_URL_RESULT: WORKING",fmt,"download bytes checked:",total,flush=True)
          # Verify two different YouTube links become two independently
          # downloadable videos and one ZIP with two named folders.
          sources=["https://youtu.be/NY6acnscmwo","https://youtu.be/aqz-KE-bpKQ"]
          payload=json.dumps({"links":sources,"format":"mp3","quality":0,
                              "rights_confirmed":True}).encode()
          code,body,_=request("/api/batches",payload,"application/json")
          assert code==202,("Unable to start real batch",code,body[:300])
          batch_id=json.loads(body)["id"]
          print("BATCH START",batch_id,flush=True)
          for i in range(240):
              code,body,_=request("/api/batches/"+batch_id)
              assert code==200,("Batch status HTTP failure",code,body[:300])
              batch=json.loads(body)
              if batch["state"] in ("complete","partial","failed"):
                  break
              if i%15==0:
                  print("BATCH PROGRESS",batch["processed"],"of",batch["total"],flush=True)
              time.sleep(2)
          assert batch["state"]=="complete",("Multi-link batch did not finish",batch)
          assert batch["succeeded"]==2 and batch["failed"]==0,batch
          assert len(batch["items"])==2,batch
          for item in batch["items"]:
              assert item["state"]=="ready" and item.get("download_url"),item
          import zipfile
          with urllib.request.urlopen(base+batch["download_url"],timeout=90) as response:
              blob=response.read(110_000_001)
              assert len(blob)<=110_000_000,"Batch archive unexpectedly large"
              assert response.headers["Content-Type"]=="application/zip",response.headers["Content-Type"]
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              names=archive.namelist()
              media=[p for p in names if p.endswith(".mp3")]
              assert len(media)==2,names
              assert len({p.split("/")[0] for p in media})==2,names
              assert "Batch Results.txt" in names,names
              assert all(archive.getinfo(p).compress_type==zipfile.ZIP_STORED for p in media)
          after=json.loads(request("/api/batches/"+batch_id)[1])
          assert after["available"]==0 and after["succeeded"]==2,after
          assert all(item["state"]=="downloaded" for item in after["items"]),after
          print("BATCH_RESULT: TWO VIDEOS, SEPARATE FOLDERS, ONE ZIP WORKING",flush=True)
          print("ALL PRODUCTION CONVERSION CHECKS PASSED",flush=True)
          PY
