name: Full-stack checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt httpx
      - name: Check backend and frontend syntax
        run: |
          python -m compileall -q app.py
          node --check static/main.js
          node --check extension/popup.js
      - name: API and security unit tests
        run: python -m unittest discover -s tests -v
      - name: Build deployment Docker image
        run: docker build --tag clipconvert-ci .
      - name: Smoke test container health
        run: |
          docker run -d --name clipconvert-ci -p 8080:8080 clipconvert-ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs clipconvert-ci
          exit 1
