<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Studio — ClipConvert</title><style>body{background:#0b1020;color:#fff;font:16px system-ui;margin:0}main{max-width:850px;margin:4rem auto;padding:2rem}h1{font-size:3rem}p{color:#b6c2da}form{display:grid;gap:1rem;background:#171f34;padding:2rem;border-radius:20px}label{display:grid;gap:.4rem}input,select,button{padding:1rem;border-radius:9px;border:1px solid #526079;background:#0b1020;color:#fff}button{background:#7064ff;cursor:pointer;font-weight:700}a{color:#a7b8ff}.preview{max-height:340px;max-width:100%}#status{margin-top:1rem}</style><main><a href="/">← ClipConvert</a><h1>Shorts Studio</h1><p>Turn authorized video footage into a polished 9:16 short with your own logo. Upload a file, choose your framing, and export 1080 × 1920 MP4.</p><form id="editor"><label>Video file<input name="video" id="video" type="file" accept="video/*" required></label><video id="preview" class="preview" controls hidden></video><label>Optional transparent logo<input name="logo" type="file" accept="image/png,image/webp"></label><label>Framing<select name="mode"><option value="fit">Fit whole video</option><option value="fill">Fill vertical frame (crop edges)</option></select></label><label>Start at (seconds)<input name="start" type="number" min="0" max="86400" value="0"></label><label>Duration (seconds, optional)<input name="duration" type="number" min="0.1" max="14400" step="0.1"></label><label><span><input name="rights_confirmed" type="checkbox" required> I own this video or have permission to edit it.</span></label><button id="submit">Create branded short</button></form><div id="status" role="status"></div></main><script>const form=document.querySelector("#editor"),status=document.querySelector("#status"),button=document.querySelector("#submit"),preview=document.querySelector("#preview");document.querySelector("#video").addEventListener("change",e=>{const f=e.target.files[0];if(f){preview.src=URL.createObjectURL(f);preview.hidden=false}});form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;status.textContent="Uploading…";try{const data=new FormData(form);if(!data.get("duration"))data.delete("duration");const r=await fetch("/api/studio/render",{method:"POST",body:data});const result=await r.json();if(!r.ok)throw Error(typeof result.detail==="string"?result.detail:"Upload failed");status.textContent="Rendering…";for(let i=0;i<240;i++){await new Promise(resolve=>setTimeout(resolve,2000));const response=await fetch(result.status_url);const job=await response.json();if(job.state==="ready"){status.innerHTML="";const link=document.createElement("a");link.href=job.download_url;link.textContent="Download branded MP4";status.append(link);return}if(job.state==="error")throw Error(job.error||"Render failed")}throw Error("Render is taking longer than expected. Please retry status later.")}catch(error){status.textContent=error.message}finally{button.disabled=false}})</script></html>
